[package]
name = "bevy_rui_mcp"
version = "0.1.7"
edition = "2024"
description = "MCP server for bevy_rui: indexes widgets, API symbols, themes, and examples directly from Rust source or prebuilt index bundles."
license = "MIT"

[[bin]]
name = "bevy-rui-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
walkdir = "2.5"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
flate2 = "1.1"
tar = "0.4"
